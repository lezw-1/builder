name: Export draw.io diagrams

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install draw.io
        run: |
          sudo apt-get install -y xvfb libgbm1 libasound2t64
          wget -q https://github.com/jgraph/drawio-desktop/releases/download/v24.7.5/drawio-amd64-24.7.5.deb
          sudo dpkg -i drawio-amd64-24.7.5.deb

      - name: Export to SVG
        run: |
          mkdir -p assets/diagram
          xvfb-run drawio --export --format svg --output assets/diagram/test.svg test.drawio

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: export draw.io to SVG"
          file_pattern: "assets/diagram/test.svg"
